services:
  # ── 1. API (Express / Node) ─────────────────────────────────
  - type: web
    name: trustvault-api
    runtime: node
    region: oregon
    branch: deployment
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    plan: free

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: MONGODB_URI
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_ISSUER
        value: trustvault

      - key: JWT_AUDIENCE
        value: trustvault-client

      - key: JWT_ACCESS_EXPIRES
        value: 15m

      - key: JWT_REFRESH_EXPIRES
        value: 7d

      - key: CLIENT_ORIGIN
        value: https://trustvault-app.onrender.com

      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_SAMESITE
        value: none

      - key: MAX_FILE_SIZE_MB
        value: "10"

  # ── 2. Static Site (React / Vite) ───────────────────────────
  - type: static
    name: trustvault-app
    branch: deployment
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://trustvault-api.onrender.com/api
