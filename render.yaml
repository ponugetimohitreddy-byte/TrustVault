##############################################################
# render.yaml — TrustVault Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Services defined here:
#   1. trustvault-api   — Express/Node Web Service  (server/)
#   2. trustvault-app   — Vite/React Static Site    (client/)
#
# ONE-TIME MANUAL SETUP (after first deploy):
#   • In the Render dashboard set the secret env vars marked
#     [SECRET] below — they are NOT committed to this file.
#   • Run the seed script once from the Render Shell:
#       node src/scripts/seed.js
##############################################################

services:
  # ── 1. API (Express) ────────────────────────────────────────
  - type: web
    name: trustvault-api
    runtime: node
    region: oregon           # change to nearest region if needed
    branch: deployment
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    plan: free

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000           # Render always binds to 10000 internally

      # MongoDB Atlas connection string  ← [SECRET] set in dashboard
      - key: MONGODB_URI
        sync: false

      # JWT secrets (min 32 chars)       ← [SECRET] set in dashboard
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_ISSUER
        value: trustvault
      - key: JWT_AUDIENCE
        value: trustvault-client
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d

      # Render injects its own public URL here automatically;
      # override CLIENT_ORIGIN once you know the static site URL.
      - key: CLIENT_ORIGIN
        value: https://trustvault-app.onrender.com   # ← update after first deploy

      # Secure cookies only over HTTPS
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none            # required for cross-origin cookie credentialing

      - key: MAX_FILE_SIZE_MB
        value: "10"

  # ── 2. Static Site (React/Vite) ─────────────────────────────
  - type: web
    name: trustvault-app
    runtime: static
    region: oregon
    branch: deployment
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free

    headers:
      - path: /*
        name: Cache-Control
        value: no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # SPA fallback — all routes serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Must point to the trustvault-api service URL
      - key: VITE_API_URL
        value: https://trustvault-api.onrender.com/api   # ← update after first deploy
